name: betelgeuse
description: "Tablero de escritorio para GitHub Projects v2"
publish_to: 'none'
version: 0.4.0+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  url_launcher: ^6.3.3
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/betelgeuse_square.png
    - assets/icon/betelgeuse_rounded.png
